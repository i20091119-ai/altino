name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "webapp/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Set build number
        run: echo "BUILD_NO=$((1 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PbuildNumber=${BUILD_NO}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: altino-camp-apk-v1.0.${{ env.BUILD_NO }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ env.BUILD_NO }}
        run: |
          set -e
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT="altino-camp-v1.0.${RUN}.apk"
          cp "$SRC" "$OUT"
          NOTES=$(git log -1 --pretty=%B)
          gh release create "v1.0.${RUN}" "$OUT" \
            --title "알티노 캠프 앱 v1.0.${RUN}" \
            --notes "$NOTES" \
            --latest
